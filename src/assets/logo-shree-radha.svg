<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="Shree Radha Clinic logo">
  <!-- Transparent background so the logo matches the site header. -->
  <g fill="#6a1b9a" font-family="'Source Sans 3', system-ui, Arial, sans-serif">
    <!-- Devanagari mark (kept slightly smaller to harmonize with Latin text) -->
    <text x="0" y="64" font-size="56" font-weight="700">श्री</text>
    <!-- Latin text uses the same site font (Source Sans 3) and is positioned closer to the mark -->
    <text x="88" y="74" font-size="36" font-weight="700">Radha Clinic</text>
  </g>
</svg>
